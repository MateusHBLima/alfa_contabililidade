# Publica sozinho quando algo entra na main.
#
# Existe para tirar a publicação de qualquer computador específico. Hoje ela
# depende da máquina de quem tem o wrangler logado — e no dia em que essa pessoa
# está em outro computador, ou de férias, o sistema para de poder ser corrigido.
#
# O que roda antes do deploy não é decoração: se os testes ou o typecheck
# falharem, nada sobe. Publicar automaticamente sem essa trava é publicar erro
# automaticamente.
name: Publicar na Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite disparar à mão pelo site do GitHub

concurrency:
  # Dois deploys ao mesmo tempo podem aplicar migrações em ordem imprevisível.
  group: deploy-producao
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testes
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Migrações do banco de produção
        # Antes do deploy, sempre: código novo que espera coluna nova em cima de
        # banco velho quebra na primeira requisição.
        run: npx wrangler d1 migrations apply planee-fiscal --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publicar
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Conferir que subiu
        # Um deploy que "terminou sem erro" e devolve 500 é um deploy quebrado.
        run: |
          sleep 10
          curl -fsS https://planee-fiscal.planee.workers.dev/api/saude | tee /dev/stderr | grep -q '"ok":true'
