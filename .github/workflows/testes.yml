# Roda os testes em toda proposta de mudança, antes de virar main.
name: Testes

on:
  pull_request:
  push:
    branches-ignore: [main]   # a main já roda no fluxo de publicação

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
